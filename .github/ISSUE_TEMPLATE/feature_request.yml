name: 💡 Feature idea
description: Suggest something that would help your restaurant, bar or inn.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job, not the solution (e.g. “Guests ask whether we have outdoor seating”).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: who
    attributes:
      label: I run a…
      options: [Restaurant, Bar or tavern, Inn or B&B, Café, Agency / developer, Other]
